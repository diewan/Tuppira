services:
  indexer:
    build:
      # The sibling protocol workspace is a declared dependency of the
      # tuppira crates, so the build context is the deliberate monorepo root.
      context: ../..
      dockerfile: csv-apps/tuppira/Dockerfile
      target: indexer
    command: ["tuppira-indexer", "start"]
    volumes:
      - ./data:/data
    environment:
      - DATABASE_URL=sqlite:///data/tuppira.db
      - CONFIG_PATH=/app/config.toml
    depends_on:
      - api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ../..
      dockerfile: csv-apps/tuppira/Dockerfile
      target: api
    command: ["tuppira-api", "start"]
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - DATABASE_URL=sqlite:///data/tuppira.db
      - CONFIG_PATH=/app/config.toml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
